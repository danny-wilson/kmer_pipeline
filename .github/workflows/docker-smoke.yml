name: docker-smoke

# PLAN.md Part C, C1 (OQ-S3-6: a CI smoke step, not a staging registry or deferred tests/
# wiring): checks only that the two bootstrapping paths (the launcher image, and -profile docker)
# actually work end to end -- not pipeline correctness, which the real goldens/tests/e2e cover
# elsewhere. Builds the Dockerfile itself (image.yml's own publish isn't available to pull from
# before Part D, and OQ-S3-8 rejected a staging registry), loads it locally, and never pushes.
#
# Separate from image.yml, whose path filter excludes exactly the paths this workflow triggers
# on: a pipeline-code change (bin/, *.nf, nextflow.config, conf/**, example/**) doesn't rebuild
# the toolchain's own equivalence checks, but does need re-checking against both bootstrap paths.

on:
  pull_request:
    paths:
      - 'bin/**'
      - '*.nf'
      - 'nextflow.config'
      - 'conf/**'
      - 'example/**'
      - '.github/workflows/docker-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - '*.nf'
      - 'nextflow.config'
      - 'conf/**'
      - 'example/**'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Host Nextflow, pinned to the exact version and checksum the Dockerfile itself installs
      # (22.04.5 -- OQ-S3-1) -- the -profile docker scenario below runs this, not the image's own
      # bundled copy, since a host without Nextflow at all is exactly what the launcher scenario
      # (no host Nextflow needed) is for.
      - name: Install host Nextflow 22.04.5 (checksummed, matching the Dockerfile's own pin)
        run: |
          set -euxo pipefail
          wget -q -O nextflow https://github.com/nextflow-io/nextflow/releases/download/v22.04.5/nextflow-22.04.5-all
          echo "2e9c5bd25191fe888fce3ea3fa5c926708918244603e0ca32bb157d0149e8e6e  nextflow" | sha256sum -c -
          chmod a+x nextflow
          sudo mv nextflow /usr/local/bin/

      - name: Set up Java (matching the Dockerfile's own openjdk-11 pin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '11.0.16+8'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Reads image.yml's own "main" build cache (if warm) but never writes to it: this is a
      # throwaway local build, not part of that workflow's own cache lineage.
      - name: Build the toolchain image (load only, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=main
          tags: kmer_pipeline:ci
          provenance: false

      - name: Launcher scenario (docs/manual.md's own quickstart docker command, verbatim)
        run: |
          set -euxo pipefail
          docker run --rm -u $(id -u):$(id -g) -e NXF_HOME=/tmp/.nextflow -e NXF_OPTS=-Dnxf.ansi.log=false \
            -v "$PWD":"$PWD" -w "$PWD" \
            kmer_pipeline:ci \
            nextflow run kmer_pipeline.nf -ansi-log false -params-file example/ci/tb20_nucleotide31.yaml \
            || { echo "::group::.nextflow.log"; cat .nextflow.log || true; echo "::endgroup::"; exit 1; }
          test -s example/ci/run/tb20_nucleotide31.report.html
          rm -rf example/ci/run work .nextflow*

      - name: Docker-profile scenario (host Nextflow, -profile docker)
        run: |
          set -euxo pipefail
          export NXF_HOME="$PWD/.nxf-docker-home" NXF_OPTS=-Dnxf.ansi.log=false
          nextflow run kmer_pipeline.nf -ansi-log false -profile docker --container kmer_pipeline:ci \
            -params-file example/ci/tb20_nucleotide31.yaml
          test -s example/ci/run/tb20_nucleotide31.report.html

      # Guards the same false-pass route P2 closed elsewhere: if this silently fell back to
      # nextflow.config's own default params.container (the published, code-bearing 2026-10-06
      # image) instead of the --container override above, the run could still "pass" without
      # ever having exercised the image this workflow just built.
      - name: Confirm the docker-profile run actually used the image just built
        run: |
          set -euxo pipefail
          # Nextflow's own task directories (not params.workdir, a separate pipeline-internal
          # concept) default to work/<hash>/<hash> under the launch directory.
          grep -rlq 'kmer_pipeline:ci' work/*/*/.command.run
