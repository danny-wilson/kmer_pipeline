name: docker-smoke

# PLAN.md Part C, C1 (OQ-S3-6: a CI smoke step, not a staging registry or deferred tests/
# wiring): checks only that the two bootstrapping paths (the launcher image, and -profile docker)
# actually work end to end -- not pipeline correctness, which the real goldens/tests/e2e cover
# elsewhere. Pulls the real, published, pinned toolchain image (nextflow.config's own
# params.container) rather than building the Dockerfile itself (Part D, D4, guards P58): before
# Part D published a real image, this workflow had no registry copy to pull from (OQ-S3-8 rejected
# a staging registry) and built its own throwaway copy instead; now that a real pinned digest
# exists, testing against it directly is both faster and more representative than a parallel
# rebuild that could itself drift from the real, published artefact.
#
# Separate from image.yml, whose path filter excludes exactly the paths this workflow triggers
# on: a pipeline-code change (bin/, *.nf, nextflow.config, conf/**, example/**) doesn't rebuild
# the toolchain's own equivalence checks, but does need re-checking against both bootstrap paths.

on:
  pull_request:
    paths:
      - 'bin/**'
      - '*.nf'
      - 'nextflow.config'
      - 'conf/**'
      - 'example/**'
      - '.github/workflows/docker-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - '*.nf'
      - 'nextflow.config'
      - 'conf/**'
      - 'example/**'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Host Nextflow, pinned to the exact version and checksum the Dockerfile itself installs
      # (22.04.5 -- OQ-S3-1) -- the -profile docker scenario below runs this, not the image's own
      # bundled copy, since a host without Nextflow at all is exactly what the launcher scenario
      # (no host Nextflow needed) is for.
      - name: Install host Nextflow 22.04.5 (checksummed, matching the Dockerfile's own pin)
        run: |
          set -euxo pipefail
          wget -q -O nextflow https://github.com/nextflow-io/nextflow/releases/download/v22.04.5/nextflow-22.04.5-all
          echo "2e9c5bd25191fe888fce3ea3fa5c926708918244603e0ca32bb157d0149e8e6e  nextflow" | sha256sum -c -
          chmod a+x nextflow
          sudo mv nextflow /usr/local/bin/

      - name: Set up Java (matching the Dockerfile's own openjdk-11 pin)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '11.0.16+8'

      # nextflow.config's own params.container (docker:// form, for Apptainer); this workflow
      # needs the bare docker.io reference instead, same digest.
      - name: Resolve the pinned image reference from nextflow.config
        id: image
        run: |
          set -euxo pipefail
          ref=$(grep -oP "docker://\K\S+(?=')" nextflow.config | head -1)
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Pull the pinned toolchain image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Launcher scenario (docs/manual.md's own quickstart docker command, verbatim)
        run: |
          set -euxo pipefail
          docker run --rm --cgroupns=host -u $(id -u):$(id -g) \
            -e NXF_HOME=/tmp/.nextflow -e NXF_OPTS='-Dnxf.ansi.log=false -XX:-UseContainerSupport' \
            -v "$PWD":"$PWD" -w "$PWD" \
            "${{ steps.image.outputs.ref }}" \
            nextflow run kmer_pipeline.nf -ansi-log false -params-file example/ci/tb20_nucleotide31.yaml \
            || { echo "::group::.nextflow.log"; cat .nextflow.log || true; echo "::endgroup::"; exit 1; }
          test -s example/ci/run/tb20_nucleotide31.report.html
          rm -rf example/ci/run work .nextflow*

      - name: Docker-profile scenario (host Nextflow, -profile docker, nextflow.config's own pinned default)
        run: |
          set -euxo pipefail
          # Same JDK 11/cgroups-v2 NullPointerException as the launcher scenario, confirmed here
          # to hit plain host Nextflow too (no docker run wrapping at all) - a host JVM issue on
          # this runner, not specific to being inside a container.
          export NXF_HOME="$PWD/.nxf-docker-home" NXF_OPTS='-Dnxf.ansi.log=false -XX:-UseContainerSupport'
          nextflow run kmer_pipeline.nf -ansi-log false -profile docker \
            -params-file example/ci/tb20_nucleotide31.yaml
          test -s example/ci/run/tb20_nucleotide31.report.html

      # Guards the same false-pass route P2 closed elsewhere: confirms the run actually used
      # nextflow.config's own pinned default (no --container override above any more), not some
      # other image reached by accident.
      - name: Confirm the docker-profile run actually used the pinned image
        run: |
          set -euxo pipefail
          # Nextflow's own task directories (not params.workdir, a separate pipeline-internal
          # concept) default to work/<hash>/<hash> under the launch directory.
          grep -rlq -- "${{ steps.image.outputs.ref }}" work/*/*/.command.run
